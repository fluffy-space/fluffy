## Security response headers, shared by every generated site.
##
## WRITTEN by NginxBuilder (`php fluffy nginx <domain>`) into /etc/nginx/snippets/ and OVERWRITTEN
## on every run — unlike the upstream file, which holds a rotation decision, this is policy and the
## repo is its source. Edit bin/setup/nginx-security-headers.conf, not the copy on the box.
##
## One shared file rather than a copy inlined per vhost: changing the policy is then one file plus
## a reload, instead of regenerating every domain and hoping none was missed.
##
## `always` on every line. Without it nginx adds the header only to 2xx/3xx, and an error page is
## exactly where a missing nosniff or frame rule still matters.
##
## ⚠️ nginx does NOT merge add_header across levels: a location carrying ANY add_header of its own
## inherits NONE of these. Every such location must `include` this file again — the long-cache
## static-asset block in nginx.conf does, because it sets its own Cache-Control.
##
## No Content-Security-Policy here on purpose. A real CSP has to allowlist the Paddle checkout
## iframe, Pirsch, CKEditor and Viewi's hydration payload; a wrong one breaks the checkout — which
## is to say, breaks the money path — so it wants its own pass with report-only first.

# Force HTTPS for a year. Deliberately no `includeSubDomains` and no `preload`: both are one-way in
# practice (preload is removed by hand, over months), and any subdomain not already HTTPS — a mail
# host, a staging box — goes dark the moment it inherits this.
add_header Strict-Transport-Security "max-age=31536000" always;

# Never let a browser second-guess a Content-Type. This matters most for user-uploaded files
# (CMS images, support attachments), where a sniffed text/html is stored XSS.
add_header X-Content-Type-Options "nosniff" always;

# No framing but our own — clickjacking cover for the authenticated /app and /admin surfaces.
# We embed Paddle, not the reverse, so the checkout is unaffected.
add_header X-Frame-Options "SAMEORIGIN" always;

# Full URL same-origin, origin only cross-origin. This is already the Chrome and Firefox default,
# so the redirect path loses nothing in practice: it clamps only a referring page that had
# deliberately opted into a more permissive policy.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Hardware APIs nothing here uses. `payment` is deliberately NOT restricted: Apple Pay and Google
# Pay inside the Paddle checkout iframe need that permission delegated to it.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
