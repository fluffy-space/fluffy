## Shared upstream for the app — generated by NginxBuilder (`php fluffy nginx <domain>`)
## into /etc/nginx/conf.d/, ONE file per app regardless of how many domains point at it.
## The upstream name and the `server` lines below are filled in by NginxBuilder. Their
## placeholder tokens are deliberately NOT spelled out in this header: the file goes through a
## plain str_replace, so a token named in a comment is substituted too — and the server list is
## MULTI-LINE, so the second line escaped the `##` and nginx read it as a top-level directive
## (nginx: directive "server" has no opening "{" — a fresh install could not pass `nginx -t`).
##
## Every site config (sites-available/<domain>) proxy_passes to this one name, so a short
## domain added later needs no upstream of its own — it inherits this. The name comes from
## `upstream` in configs/server.php, which is why all of them agree.
##
## EVERY instance from `instances` (configs/server.php) is listed; standbys are marked `down`,
## so this file states both the topology and which release is live. `down` (not `backup`) is
## deliberate: a standby runs the PREVIOUS release, and silently failing traffic over to older
## code — against a schema that has since migrated — is worse than a loud 502. Rotate by moving
## the `down` marker to the other line and reloading; nginx drains in-flight requests itself.
##
## WRITTEN ONCE, then owned by whoever rotates traffic. NginxBuilder will not overwrite an
## existing file, so regenerating a site config can never swing traffic back to the other
## release. The one exception: a file with no `upstream <name> {` block in it holds no rotation
## decision and only breaks `nginx -t`, so it is regenerated and the old content kept alongside
## as `.broken`. Note the flip side: adding an instance to configs/server.php will NOT reach this
## file — update it by hand (or delete it and regenerate).

upstream _UPSTREAM_ {
_SERVERS_

  # KEEPALIVE POOL — the fix for the p99 blow-up. Without this, nginx opens a
  # fresh TCP connection to Swoole for EVERY proxied request (the `Connection ""`
  # + `proxy_http_version 1.1` in the site config are inert unless the pool exists).
  # Under high concurrency that connection churn was the whole nginx-vs-Caddy gap
  # (Tests/performance.md: nginx p99 2278ms -> with keepalive it collapses).
  keepalive 256;
  keepalive_timeout 60s;
  keepalive_requests 100000;
}
